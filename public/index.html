<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TripWise 旅遊比較</title><style>body{margin:0;font-family:Arial;background:#fbfaf6;color:#173747}.wrap{max-width:1050px;margin:auto;padding:24px}nav{display:flex;justify-content:space-between;font-weight:bold}.hero{background:#f4eee1;padding:70px 0}h1{font-size:46px}em{color:#eb735d;font-style:normal}.tag,.agency{color:#198d87;font-size:12px;font-weight:bold}.button{background:#173747;color:#fff;padding:13px 18px;text-decoration:none;border-radius:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e4e0d8;border-radius:8px;overflow:hidden}.pic{font-size:56px;text-align:center;padding:35px;background:#bce4bb}.info{padding:14px}.price{font-size:20px;font-weight:bold}.filters button,.needs button{padding:10px;margin:4px;border:1px solid #ddd;border-radius:18px;background:#fff}.filters .on{background:#173747;color:#fff}.recommend{background:#173747;color:#fff;margin-top:65px}.needs{display:grid;grid-template-columns:1fr 1fr}.needs button{background:#244653;color:#fff;border-color:#55717b;text-align:left}.result{background:#f5eee1;color:#173747;padding:14px;margin-top:10px;border-radius:4px}@media(max-width:650px){.grid{grid-template-columns:1fr}h1{font-size:34px}}</style><body><nav class="wrap">✦ TripWise <span>方案比較　旅客推薦</span></nav><section class="hero"><div class="wrap"><p class="tag">TRAVEL SMARTER</p><h1>每一趟出發，<br><em>都值得精打細算。</em></h1><p>一次比較各家旅行社的行程、價格與真實價值。</p><a class="button" href="#compare">探索熱門行程 →</a></div></section><main id="compare" class="wrap"><p class="tag">CURATED FOR YOU</p><h2>熱門行程方案</h2><div class="filters"><button class="on" onclick="show('all',this)">全部</button><button onclick="show('日本',this)">日本</button><button onclick="show('歐洲',this)">歐洲</button><button onclick="show('東南亞',this)">東南亞</button></div><div class="grid" id="grid"></div></main><section class="recommend"><div class="wrap"><p class="tag">PERSONAL MATCH</p><h2>不知道怎麼選？讓需求替你說話。</h2><div class="needs"><button onclick="rec('峴港會安五日｜NT$21,800 起，CP 9.5 的預算首選。')">◎ 預算優先</button><button onclick="rec('東京輕井澤五日｜步調舒適、移動距離適中。')">☁ 舒適慢遊</button><button onclick="rec('沖繩親子四日｜樂園與海洋館一次滿足。')">♡ 親子同樂</button><button onclick="rec('京都奈良六日｜把楓葉與古寺都收進鏡頭。')">✦ 追景攝影</button></div><div class="result" id="result">為你推薦｜峴港會安五日</div></div></section><script>let d=[['日本','⛩','雄獅旅遊','東京輕井澤・富士山慢遊五日','32,900','9.3'],['歐洲','🏰','可樂旅遊','德奧捷童話小鎮・十日','76,800','9.1'],['東南亞','🌿','東南旅遊','峴港會安・五星海濱度假五日','21,800','9.5'],['海島','🐠','易遊網','沖繩親子樂園・海洋假期四日','26,900','9.0']];function show(c,b){document.querySelectorAll('.filters button').forEach(x=>x.className='');b.className='on';grid.innerHTML=d.filter(x=>c==='all'||x[0]===c).map(x=>'<article class="card"><div class="pic">'+x[1]+'</div><div class="info"><span class="agency">'+x[2]+'</span><h3>'+x[3]+'</h3><small>含機票＋住宿・CP '+x[5]+'</small><div class="price">NT$ '+x[4]+' 起</div></div></article>').join('')}function rec(x){result.textContent='為你推薦｜'+x}show('all',document.querySelector('.on'))</script></body></html>
