<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TripWise 旅遊行程比較平台">
  <title>TripWise｜旅遊方案比較</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav wrap"><a class="brand" href="#top">✦ <span>TripWise</span></a><div><a href="#compare">方案比較</a><a href="#recommend">旅客推薦</a></div></nav>
  <header id="top" class="hero"><div class="wrap hero-grid"><div><p class="eyebrow">TRAVEL SMARTER</p><h1>每一趟出發，<br><em>都值得精打細算。</em></h1><p>一次比較各家旅行社的行程、價格與 CP 值，把預算花在最值得的風景上。</p><a class="button" href="#compare">探索熱門行程 →</a></div><div class="hero-art">✈<span>你的下趟旅行<br><b>從比較開始</b></span></div></div></header>
  <main id="compare" class="wrap section"><p class="eyebrow">CURATED FOR YOU</p><h2>熱門行程方案</h2><div id="filters" class="filters"><button data-area="all" class="active">全部目的地</button><button data-area="日本">日本</button><button data-area="歐洲">歐洲</button><button data-area="東南亞">東南亞</button><button data-area="海島">海島</button></div><div id="tripGrid" class="grid"></div></main>
  <section id="recommend" class="recommend"><div class="wrap recommend-grid"><div><p class="eyebrow">PERSONAL MATCH</p><h2>不知道怎麼選？<br>讓需求替你說話。</h2><p>選擇最在意的旅行條件，立刻取得適合的方案。</p></div><div><div id="needs" class="needs"><button data-need="budget">◎ 預算優先</button><button data-need="comfort">☁ 舒適慢遊</button><button data-need="family">♡ 親子同樂</button><button data-need="scenery">✦ 追景攝影</button></div><div id="result" class="result"></div></div></div></section>
  <footer class="wrap">✦ TripWise　© 2026 Travel with intention.</footer>
  <script src="app.js"></script>
</body>
</html>
